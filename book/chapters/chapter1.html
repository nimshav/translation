<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>פרק 1</title>
  <style>
    /* Global Dark Mode */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #1b1b1b;
      color: #e0e0e0;
      font-family: "Arial", "Noto Sans Hebrew", sans-serif;
      direction: rtl;
      text-align: right;
    }

    /* Centered Content Container */
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    /* Main Content Box */
    .content-frame {
      width: 90%;
      max-width: 800px;
      padding: 30px;
      background: #2b2b2b;
      border: 1px solid #444;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(255, 140, 0, 0.3);
    }

    /* Proper RTL alignment for text */
    .content-frame h1,
    .content-frame h2,
    .content-frame h3,
    .content-frame p,
    .content-frame ul,
    .content-frame ol,
    .content-frame li {
      text-align: right;
    }

    /* Link Styling */
    .content-frame a {
      color: #ff8c00;
      text-decoration: none;
    }

    .content-frame a:hover {
      text-decoration: underline;
      color: #ffa500;
    }

    /* Horizontal rule styling */
    .content-frame hr {
      border: none;
      border-top: 1px solid #444;
      margin: 40px 0;
    }

    /* Footnotes Section */
    #footnotes {
      margin-top: 20px;
      padding: 10px;
      background-color: #222;
      border-radius: 5px;
    }

    #footnotes h2 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    #footnotes ol {
      padding-right: 20px;
    }

    #footnotes li {
      margin-bottom: 8px;
      color: #ccc;
    }

    #footnotes a {
      color: #ff8c00;
      text-decoration: none;
    }

    #footnotes a:hover {
      text-decoration: underline;
      color: #ffa500;
    }
</html>
