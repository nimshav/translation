<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table of Contents</title>
  <style>
    /* Global Dark Mode and Full Viewport Height */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #1b1b1b;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
    }

    /* Center content vertically and horizontally */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px; /* Provides spacing on smaller screens */
    }

    /* Perfect Box Container */
    .content-box {
      width: 90%;
      max-width: 800px;
      padding: 40px;
      background: #2b2b2b;
      border: 1px solid #444;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(255, 140, 0, 0.3);
    }

    /* Center all text within the box */
    .content-box h1,
    .content-box h2,
    .content-box h3,
    .content-box p,
    .content-box ul,
    .content-box li {
      text-align: center;
    }

    /* Link Styling */
    .content-box a {
      color: #ff8c00;
      text-decoration: none;
    }
    
    .content-box a:hover {
      text-decoration: underline;
      color: #ffa500;
    }

    /* Hebrew Text Support */
    [lang="he"], .rtl {
      direction: rtl;
      text-align: center;
      font-family: Arial, "Noto Sans Hebrew", sans-serif;
    }
    
    /* Center list items */
    .content-box ul {
      list-style-position: inside;
      padding: 0;
    }
    
    .content-box li {
      margin: 10px 0;
    }
    
    /* Horizontal rule styling (optional) */
    .content-box hr {
      border: none;
      border-top: 1px solid #444;
      margin: 40px 0;
    }
  </style>
</head>
<body>
  <div class="content-box">
    <h1>Table of Contents</h1>
    <ul>
      <li><a href="#intro">Introduction</a></li>
      <li><a href="#chapter1">Chapter 1: Background</a></li>
      <li><a href="#chapter2">Chapter 2: Methodology</a></li>
      <li><a href="#chapter3">Chapter 3: Results</a></li>
      <li><a href="#chapter4">Chapter 4: Discussion</a></li>
      <li><a href="#conclusion">Conclusion</a></li>
    </ul>
  </div>
</body>
</html>
